name: CI

on:
  push:
    branches: ["main", "claude/**", "phase-*/**"]
  pull_request:

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: mypy (strict)
        run: uv run mypy src tests

  tests:
    name: Tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextcore
          POSTGRES_PASSWORD: nextcore-ci
          POSTGRES_DB: next_core_dev
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nextcore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nextcore:nextcore-ci@127.0.0.1:5433/next_core_dev
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Create tenant test databases
        run: |
          for db in next_core_ta next_core_tb; do
            PGPASSWORD=nextcore-ci createdb -h 127.0.0.1 -p 5433 -U nextcore "$db" || true
          done
      - name: pytest + coverage
        run: |
          uv run coverage run -m pytest tests
          uv run coverage report
      - name: Migration check (no un-generated migrations)
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          NEXT_CORE_PROFILE: local

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mkdocs build --strict

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Bandit (SAST)
        run: uv run bandit -c pyproject.toml -r src
      - name: pip-audit (dependency vulnerabilities)
        run: |
          uv export --frozen --no-emit-project --no-dev -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --disable-pip
      - name: Gitleaks (secret scan, full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source /repo --log-opts="--all" --redact --exit-code 1

  onprem-boot:
    name: On-premise profile boots without control plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextcore
          POSTGRES_PASSWORD: nextcore-ci
          POSTGRES_DB: next_core_onprem
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nextcore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXT_CORE_PROFILE: onprem
      DJANGO_SETTINGS_MODULE: next_core.settings.onprem
      DJANGO_SECRET_KEY: ci-onprem-boot-only
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgres://nextcore:nextcore-ci@127.0.0.1:5433/next_core_onprem
      NEXT_CORE_TENANT_ID: 7e6a6a1e-96b8-4dc0-a1a2-3c1f6f6b0001
      NEXT_CORE_TENANT_SLUG: mainbank
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Control plane must be absent
        run: |
          uv run python -c "
          import django; django.setup()
          from django.conf import settings
          assert not any('control_plane' in a for a in settings.INSTALLED_APPS)
          print('control plane absent: OK')"
      - name: Migrate (control alias + tenant fan-out, static directory)
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate_tenants
      - name: Serve and assert health + tenant-scoped route
        run: |
          uv run gunicorn next_core.wsgi:application --bind 127.0.0.1:8010 --daemon
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8010/health/ready && break || sleep 2
          done
          curl -sf http://127.0.0.1:8010/health/ready
          # Data plane serves without control plane: unauthenticated request on the
          # tenant-scoped route must be a clean 401 (resolved tenant, missing token).
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8010/api/v1/audit/events)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          echo "onprem serves data plane without control plane: OK"

  compose-smoke:
    name: Compose runtime smoke (app + postgres + redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up -d --build postgres redis app
      - name: Wait for readiness and assert health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://127.0.0.1:8000/health/ready || true)
            if [ "$code" = "200" ]; then cat /tmp/ready.json; exit 0; fi
            sleep 2
          done
          echo "readiness never became 200"; docker compose logs app | tail -50; exit 1
      - name: Liveness + correlation header present
        run: |
          curl -sfi http://127.0.0.1:8000/health/live | tee /tmp/live.txt
          grep -i "X-Request-ID" /tmp/live.txt
      - name: Teardown
        if: always()
        run: docker compose down -v
