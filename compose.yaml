# Next Core — development stack. `docker compose up` starts app + PostgreSQL + Redis.
# Keycloak (dev realm) is behind the `iam` profile until Phase 2: `docker compose --profile iam up`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nextcore
      POSTGRES_PASSWORD: nextcore-dev-only     # dev stack only; never a production value
      POSTGRES_DB: next_core_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcore -d next_core_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      NEXT_CORE_PROFILE: local
      DJANGO_SECRET_KEY: insecure-local-dev-key-do-not-deploy
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://nextcore:nextcore-dev-only@postgres:5432/next_core_dev
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    profiles: ["iam"]                          # activated in Phase 2 (IAM boundary)
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
    ports:
      - "8080:8080"

volumes:
  pgdata:
