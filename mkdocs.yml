site_name: Next Core — Documentation
site_description: Bank-grade lightweight core banking system
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  # Material's native Mermaid support — renders ```mermaid fences client-side, no
  # network access needed at build time (works in restricted/air-gapped builds).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Links pointing outside docs/ (CLAUDE.md, .claude/*) are valid in the GitHub view;
# report them at info level here instead of failing the strict build.
validation:
  links:
    not_found: info
    absolute_links: info
  nav:
    omitted_files: ignore
