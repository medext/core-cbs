site_name: Next Core — Documentation
site_description: Bank-grade lightweight core banking system
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  # Material's native Mermaid support — renders ```mermaid fences client-side, no
  # network access needed at build time (works in restricted/air-gapped builds).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Strict link integrity: unresolved links fail the build. Docs must not use Markdown links
# to files outside docs/ (CLAUDE.md, .claude/*) — reference those as inline code instead.
validation:
  links:
    not_found: warn
    absolute_links: warn
  nav:
    omitted_files: ignore
